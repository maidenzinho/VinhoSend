name: Testes PHP

on:
  push:
    branches: [ main, develop, homologacao ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  php-tests:
    name: Lint e testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, pdo, pdo_mysql

      - name: Verificar sintaxe dos arquivos PHP
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Executar testes unitários
        run: php tests/run.php
